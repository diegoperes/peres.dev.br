name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: o lastmod do sitemap é a data do último commit de cada página

      # Só o que é do site: fora os anúncios (anuncios/), as fontes das imagens (design/), os scripts, o README e os
      # arquivos do git/GitHub.
      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'anuncios' --exclude 'design' --exclude 'scripts' --exclude 'README.md' --exclude '.DS_Store' --exclude '.gitignore'
          python3 scripts/sitemap.py _site
          # Páginas e os versao.json que os programas instalados consultam (não podem mudar de lugar)
          for f in CNAME robots.txt sitemap.xml index.html css/produto.css js/site-config.js mywork/index.html minhagaragem/index.html \
                   mywork/2027/versao.json minhagaragem/2027/versao.json; do
            test -f "_site/$f" || { echo "Falta $f"; exit 1; }
          done
          ls -R _site | head -50

      # E-mail de suporte: vem da variável (ou secret) EMAIL do repositório e só existe no site publicado.
      - name: Prepare site with repository variables
        env:
          EMAIL: ${{ vars.EMAIL || secrets.EMAIL }}
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path

          email = os.environ.get("EMAIL", "").strip()
          if not email:
              raise SystemExit("Missing GitHub Actions variable or secret: EMAIL")
          Path("_site/js/site-config.js").write_text(
              "window.SITE_CONFIG = {\n  email: " + json.dumps(email) + ",\n};\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
