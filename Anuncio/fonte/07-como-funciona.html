<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Imagem 07 do anúncio do MyWork (refeita para a edição 2027). Gerar: Anuncio/fonte/gerar.sh -->
<link rel="stylesheet" href="../MeusCarros/fonte/anuncio.css">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(../MeusCarros/fonte/fonts/Inter-400.ttf); }
  @font-face { font-family: Inter; font-weight: 600; src: url(../MeusCarros/fonte/fonts/Inter-600.ttf); }
  @font-face { font-family: Inter; font-weight: 700; src: url(../MeusCarros/fonte/fonts/Inter-700.ttf); }
  @font-face { font-family: Inter; font-weight: 800; src: url(../MeusCarros/fonte/fonts/Inter-800.ttf); }
  :root { --tinta: #16233a; --suave: #4a5872; --laranja: #1a6fe0; --faixa: #1d314e; }
  .passos { list-style: none; padding: 0; margin: 90px 0 0; display: grid; gap: 60px; counter-reset: p; }
  .passos li { display: flex; align-items: center; gap: 36px; counter-increment: p; }
  .passos li::before { content: counter(p); flex: none; width: 110px; height: 110px; border-radius: 50%; background: var(--laranja); color: #fff; display: grid; place-items: center; font-size: 52px; font-weight: 800; }
  .passos b { display: block; font-size: 40px; letter-spacing: -0.01em; }
  .passos span { display: block; font-size: 26px; color: var(--suave); margin-top: 6px; }
</style>
</head>
<body>
  <div class="pagina">
    <h1>Como <em class="junto">funciona</em></h1>
    <ol class="passos">
      <li><div><b>Compre aqui no Mercado Livre</b></div></li>
      <li><div><b>Receba o link e a chave</b><span>pelas mensagens da compra</span></div></li>
      <li><div><b>Instale e ative</b><span>a licença do MyWork 2027 fica no seu CPF ou CNPJ</span></div></li>
    </ol>
  </div>
  <div class="faixa">Inclui as atualizações de correção da edição 2027</div>
</body>
</html>
