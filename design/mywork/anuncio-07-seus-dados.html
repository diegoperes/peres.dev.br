<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Imagem 07 do anúncio do MyWork. Gerar: design/mywork/gerar.sh -->
<link rel="stylesheet" href="../comum/anuncio.css">
<style>
  :root { --tinta: #16233a; --suave: #4a5872; --laranja: #1a6fe0; --laranja-claro: #eaf2fe; --faixa: #1d314e; }
  .centro { text-align: center; padding-top: 110px; }
  .cadeado { width: 150px; height: 150px; border-radius: 36px; background: var(--laranja-claro); display: grid; place-items: center; margin: 0 auto 50px; }
  .checks { width: 900px; margin: 60px auto 0; text-align: left; }
</style>
</head>
<body>
  <div class="centro">
    <div class="cadeado"><svg viewBox="0 0 24 24" width="76" height="76"><rect x="4" y="10" width="16" height="11" rx="2.5" fill="none" stroke="#1a6fe0" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#1a6fe0" stroke-width="2"/></svg></div>
    <h1>Seus dados ficam <em>no seu aparelho</em></h1>
    <ul class="checks">
      <li>Funciona sem internet, nada vai para a nuvem de terceiros</li>
      <li>Backup com um clique para pen drive ou a sua nuvem</li>
      <li>Cópia automática todo dia e antes de cada atualização</li>
      <li>Avisa quando sai versão nova</li>
    </ul>
  </div>
  <div class="faixa">Windows 10/11, macOS 12 e Android 8 ou mais novos</div>
</body>
</html>
