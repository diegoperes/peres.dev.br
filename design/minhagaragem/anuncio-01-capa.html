<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../comum/anuncio.css">
<style>
  /* Capa: o programa num notebook e no celular, em fundo branco (como a capa do MyWork) */
  .tampa { position: absolute; left: 50px; top: 250px; width: 960px; padding: 22px 22px 26px; background: #1b2230; border-radius: 28px 28px 0 0; }
  .tampa img { display: block; width: 916px; border-radius: 3px; }
  .base { position: absolute; left: -10px; top: 870px; width: 1080px; height: 28px; border-radius: 0 0 26px 26px; background: linear-gradient(#e6e8ec, #c3c7ce); box-shadow: 0 30px 50px rgba(23, 32, 54, .16); }
  .base::before { content: ""; position: absolute; left: 460px; top: 0; width: 160px; height: 10px; border-radius: 0 0 10px 10px; background: #aeb3bb; }
  .celular { position: absolute; left: 860px; top: 380px; width: 300px; height: 640px; padding: 12px; background: #1b2230; border-radius: 44px; box-shadow: 0 30px 60px rgba(23, 32, 54, .28); overflow: hidden; }
  .celular img { display: block; width: 276px; border-radius: 32px; }
</style>
</head>
<body>
  <div class="tampa"><img src="telas/inicio.png" alt=""></div>
  <div class="base"></div>
  <div class="celular"><img src="telas/celular-inicio.png" alt=""></div>
</body>
</html>
